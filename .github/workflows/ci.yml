name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BlogManagement.slnx

      - name: Build
        run: dotnet build BlogManagement.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test BlogManagement.slnx --configuration Release --no-build
